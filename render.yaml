services:
  - type: web
    name: agritrace-staging
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/health
    autoDeploy: false
    disk:
      name: agritrace-staging-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/agritrace.db
      - key: JWT_SECRET
        generateValue: true
