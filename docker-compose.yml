services:
  app:
    build:
      context: .
      args:
        COMMIT_SHA: ${COMMIT_SHA:-local}
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DATABASE_PATH: data/agritrace.db
    volumes:
      - agritrace_data:/app/backend/data

volumes:
  agritrace_data:
